services:
  sih-network-forecaster:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: world_model_sih2026
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s